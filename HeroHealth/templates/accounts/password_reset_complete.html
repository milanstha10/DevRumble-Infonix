{% extends 'base.html' %}

{% block title %}HeroHealth | Password Reset Complete{% endblock %}

{% block content %}
<div class="consultation-container" id="passwordResetCompleteContainer">
    <div class="glass-card" id="passwordResetCompleteCard" style="text-align: center;">
        <div class="consultation-header">
            <div style="font-size: 3.5rem; color: var(--accent); margin-bottom: 1rem;">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h2 class="consultation-title">Password Reset Complete</h2>
            <p class="consultation-desc">Your password has been successfully reset!</p>
        </div>
        
        <p style="color: var(--text-muted); font-size: 0.95rem; margin-top: 1rem; margin-bottom: 2rem;">
            You can now log in to your account with your new password.
        </p>
        
        <div style="text-align: center;" id="passwordResetCompleteFooter">
            <a href="{% url 'login' %}" class="btn-premium" style="text-decoration: none;">Log In Now</a>
        </div>
    </div>
</div>
{% endblock %}
